<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glavbook</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top Tabs Bar -->
  <div id="tab-bar">
    <div id="tabs-container"></div>
    <button id="btn-new-tab" title="New Tab">+</button>
  </div>

  <!-- Navigation Toolbar -->
  <div id="nav-bar">
    <button id="btn-back" title="Back">⮜</button>
    <button id="btn-forward" title="Forward">⮞</button>
    <button id="btn-reload" title="Reload">⟳</button>
    <button id="btn-home" title="Home">⌂</button>
    <input type="text" id="url-input" placeholder="Enter URL or search query..." />
    <button id="btn-go">Go</button>
    
    <!-- Tab-Specific Proxy Input -->
    <input type="text" id="proxy-input" placeholder="Proxy (e.g. 127.0.0.1:8080)" />
    <button id="btn-proxy">Set Proxy</button>
  </div>

  <!-- Main View Area -->
  <div id="main-container">
    <aside id="sidebar">
  <div class="sidebar-header">Quick Links</div>
  <div class="button-row">
    <button onclick="navigateTo('https://gemini.google.com')">Gemini</button>
    <button onclick="navigateTo('https://alice.yandex.ru')">Alice</button>
    <button onclick="navigateTo('https://claude.ai')">Claude</button>
  </div>
  <div class="button-row">
    <button onclick="navigateTo('https://www.google.com')">Google</button>
    <button onclick="navigateTo('https://ya.ru')">Yandex</button>
    <button onclick="navigateTo('https://www.bing.com')">Bing</button>
  </div>
    </aside>
    <main id="webview-container"></main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
